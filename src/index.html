<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Slums Launcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">
        <span class="logo-icon">⚔</span>
        <h1 id="app-name">The Slums</h1>
      </div>
      <nav>
        <button class="tab-btn active" data-tab="game">Game</button>
        <button class="tab-btn" data-tab="addons">Addons</button>
      </nav>
      <button class="btn-register" id="btn-register">Register Account</button>
    </header>

    <main>
      <div id="tab-game" class="tab-content active">

        <!-- STATE: Not Installed -->
        <div id="state-not-installed" class="state-view">
          <div class="hero-install">
            <div class="hero-icon">⚔</div>
            <h2 id="tagline">AzerothCore WotLK 3.3.5a</h2>
            <p class="hero-note">First-time download: ~8 GB</p>
            <button class="btn-primary" id="btn-install">Install The Slums</button>
          </div>
        </div>

        <!-- STATE: Downloading / Updating -->
        <div id="state-downloading" class="state-view hidden">
          <div class="progress-card">
            <h3 id="dl-phase">Preparing...</h3>
            <div class="progress-bar">
              <div class="progress-fill" id="dl-fill"></div>
            </div>
            <p id="dl-status"></p>
            <p id="dl-detail" class="text-dim"></p>
          </div>
        </div>

        <!-- STATE: Ready -->
        <div id="state-ready" class="state-view hidden">
          <div class="hero-play">
            <button class="btn-primary btn-play" id="btn-play">▶ PLAY</button>
            <p class="play-footnote" id="play-server">wow.asslorde.com</p>
            <button class="btn-link" id="btn-check-update">Check for Updates</button>
          </div>
          <div class="stats-card">
            <div class="stat-row"><span class="stat-label">Client Size</span><span class="stat-value" id="stat-size">—</span></div>
            <div class="stat-row"><span class="stat-label">Server</span><span class="stat-value" id="stat-server">—</span></div>
            <div class="stat-row"><span class="stat-label">Addons</span><span class="stat-value" id="stat-addons">—</span></div>
            <button class="btn-danger btn-sm" id="btn-clear-cache">Clear Cache</button>
          </div>
        </div>
      </div>

      <!-- Addons Tab -->
      <div id="tab-addons" class="tab-content">
        <div class="addons-toolbar">
          <div class="addon-tabs">
            <button class="addon-tab-btn active" data-addon-tab="installed">Installed (<span id="installed-count">0</span>)</button>
            <button class="addon-tab-btn" data-addon-tab="browse">Browse</button>
          </div>
          <div class="addons-actions" id="browse-actions">
            <div class="addons-search">
              <input type="text" id="addon-search" placeholder="Search addons..." />
            </div>
            <select id="addon-sort">
              <option value="popular">Most Popular</option>
              <option value="newest">Recently Added</option>
              <option value="az">Name A-Z</option>
              <option value="za">Name Z-A</option>
            </select>
            <select id="addon-expansion">
              <option value="wotlk">WotLK 3.3.5a</option>
              <option value="tbc">TBC 2.4.3</option>
              <option value="classic">Classic 1.12.1</option>
            </select>
          </div>
        </div>
        <div id="addon-grid" class="addon-grid">
          <div class="loading">Loading addons...</div>
        </div>
        <div id="addon-pager" class="addon-pager hidden">
          <button id="page-prev">← Prev</button>
          <span id="page-info">Page 1</span>
          <button id="page-next">Next →</button>
        </div>
      </div>
    </main>

    <!-- Detail Modal -->
    <div id="modal" class="modal-overlay hidden">
      <div class="modal-card">
        <button class="modal-close">&times;</button>
        <div class="modal-image" id="modal-image">
          <div class="modal-image-placeholder">A</div>
        </div>
        <h3 id="modal-title">Addon Title</h3>
        <p id="modal-author" class="text-dim"></p>
        <p id="modal-desc"></p>
        <div class="modal-actions">
          <button class="btn-primary" id="modal-action">Install</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
