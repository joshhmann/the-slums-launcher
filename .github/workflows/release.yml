name: Build & Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
          - platform: ubuntu-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm ci

      - name: Bump version (canary)
        if: github.ref_name == 'dev'
        shell: bash
        run: |
          # Canary gets a -canary suffix so the updater sees it as newer than stable
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const ts = Math.floor(Date.now() / 1000).toString(36);
            p.version = p.version + '-canary.' + ts;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(p, null, 2));
            console.log('Canary version:', p.version);
          "

      - name: Build & Publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name == 'main' && 'stable' || 'canary' }}
          releaseName: ${{ github.ref_name == 'main' && 'The Slums Launcher (Stable) — v__VERSION__' || 'The Slums Launcher (Canary) — v__VERSION__' }}
          releaseBody: ${{ github.ref_name == 'main' && 'Stable channel build.' || 'Canary channel build — may be unstable.' }}
          releaseDraft: false
          prerelease: ${{ github.ref_name != 'main' }}
          args: ${{ matrix.args }}
