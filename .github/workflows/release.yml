name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm ci

      # Windows: build + publish in one step via tauri-action.
      - name: Build & Publish (Windows)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # One release per version — tag vX.Y.Z, always marked latest.
          tagName: v__VERSION__
          releaseName: "The Slums Launcher — v__VERSION__"
          releaseBody: "The Slums Launcher build."
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      # Linux: build manually (without npm postbuild hook — that double-patches
      # and can corrupt the file), then patch AppRun (EGL fix) BEFORE upload.
      - name: Build (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          npm run build:frontend
          npx tauri build
          bash scripts/patch-appimage.sh

      - name: Publish (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "The Slums Launcher — v__VERSION__"
          releaseBody: "The Slums Launcher build."
          releaseDraft: false
          prerelease: false
          # Build already done above (patched AppImage); just upload bundles.
          tauriScript: "true"
